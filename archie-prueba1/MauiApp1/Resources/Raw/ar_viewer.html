<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Archie Measure</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }
        canvas { display: block; }
        
        /* Apple-style UI */
        #ui { 
            position: absolute; bottom: 80px; width: 100%; text-align: center; pointer-events: none; 
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        
        #btnMeasure {
            pointer-events: auto; width: 64px; height: 64px; border-radius: 32px;
            background: rgba(255, 255, 255, 0.9); border: 4px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s; display: none; cursor: pointer;
        }
        #btnMeasure:active { transform: scale(0.9); background: #e0e0e0; }
        #btnMeasure::after {
            content: ''; width: 44px; height: 44px; border-radius: 22px; background: white; border: 2px solid #ccc;
        }

        #info {
            position: absolute; top: 60px; width: 100%; text-align: center; pointer-events: none;
        }
        .chip {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 12px 24px; font-size: 28px; font-weight: 600;
            background: rgba(30, 30, 30, 0.6); color: #fff; border-radius: 18px;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); letter-spacing: -0.5px;
        }
        
        #btnEnterAR {
            pointer-events: auto; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 16px 32px; font-size: 17px; font-weight: 600; border-radius: 25px; border: none;
            background: #007AFF; color: white; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 122, 255, 0.3);
        }
        
        #unsupportedMsg {
            position: absolute; top: 50%; left: 10%; right: 10%; transform: translateY(-50%);
            background: white; padding: 20px; border-radius: 20px; text-align: center;
            display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #unsupportedMsg h2 { margin-top: 0; font-size: 20px; color: #333; }
        #unsupportedMsg p { color: #666; font-size: 15px; line-height: 1.4; }
    </style>
</head>
<body>
    <div id="info"><div class="chip" id="distLabel">Mueve tu celular...</div></div>
    
    <div id="ui">
        <button id="btnMeasure"></button>
    </div>
    
    <button id="btnEnterAR">Activar Regla (AR)</button>
    
    <div id="unsupportedMsg">
        <h2>AR No Soportado</h2>
        <p>Tu dispositivo no soporta WebXR o necesitas instalar 'Google Play Services for AR' para tener medición láser de alta precisión.</p>
    </div>

    <!-- Modulos Three.js importados de unpkg -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.149.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.149.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let camera, scene, renderer;
        let reticle;
        
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        
        let points = [];
        let line = null;
        let dot1 = null;
        let dot2 = null;

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // Intentar inicializar AR Button
            try {
                const arButton = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] });
                arButton.style.display = 'none'; // Oculto, usaremos el nuestro
                document.body.appendChild(arButton);
                
                document.getElementById('btnEnterAR').addEventListener('click', () => {
                    arButton.click();
                    document.getElementById('btnEnterAR').style.display = 'none';
                    document.getElementById('btnMeasure').style.display = 'flex';
                });
            } catch(e) {
                document.getElementById('btnEnterAR').style.display = 'none';
                document.getElementById('unsupportedMsg').style.display = 'block';
            }

            // Apple Style Reticle (Outer Ring + Inner Dot)
            reticle = new THREE.Group();
            
            const ringGeo = new THREE.RingGeometry(0.04, 0.045, 32).rotateX(-Math.PI / 2);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.8, transparent: true });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            reticle.add(ring);
            
            const centerGeo = new THREE.CircleGeometry(0.005, 16).rotateX(-Math.PI / 2);
            const centerMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const center = new THREE.Mesh(centerGeo, centerMat);
            reticle.add(center);

            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            const btnMeasure = document.getElementById('btnMeasure');
            btnMeasure.addEventListener('click', onMeasureClick);

            window.addEventListener('resize', onWindowResize);
        }

        function createDot(position) {
            const geo = new THREE.SphereGeometry(0.008, 16, 16);
            const mat = new THREE.MeshBasicMaterial({ color: 0x007AFF }); // Apple Blue
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(position);
            scene.add(mesh);
            return mesh;
        }

        function onMeasureClick() {
            if(!reticle.visible) return;
            
            if(points.length === 0) {
                // Primer Punto
                const p = new THREE.Vector3();
                p.setFromMatrixPosition(reticle.matrix);
                points.push(p);
                dot1 = createDot(p);
                
                // Efecto visual pulsación
                document.getElementById('btnMeasure').style.borderColor = "rgba(0, 122, 255, 0.5)";
                document.getElementById('distLabel').innerText = "Trazando...";
                
            } else if(points.length === 1) {
                // Segundo Punto
                const p = new THREE.Vector3();
                p.setFromMatrixPosition(reticle.matrix);
                points.push(p);
                dot2 = createDot(p);
                
                document.getElementById('btnMeasure').style.borderColor = "rgba(255, 255, 255, 0.4)";
                
                // Alert a MAUI Native C# (esto hará trigger del evento OnGuardarMedida)
                const dist = points[0].distanceTo(points[1]).toFixed(2);
                document.getElementById('distLabel').innerText = dist + " m";
                
                // Cambiar tÃ­tulo
                setTimeout(() => {
                    // Alert nativo que será interceptado por WebView MAUI
                    // Se usa "prompt" o alertas para pasar datos
                    const promptVal = prompt("ARCHIE_MEDIDA:" + dist, dist);
                    
                    // Reset después de guardar
                    resetMeasure();
                }, 1000);
            }
        }
        
        function resetMeasure() {
            if(dot1) scene.remove(dot1);
            if(dot2) scene.remove(dot2);
            if(line) scene.remove(line);
            points = [];
            dot1 = null; dot2 = null; line = null;
            document.getElementById('distLabel').innerText = "Busca una superficie";
            document.getElementById('btnMeasure').style.borderColor = "rgba(255, 255, 255, 0.4)";
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then(function (referenceSpace) {
                        session.requestHitTestSource({ space: referenceSpace }).then(function (source) {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', function () {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                        document.getElementById('btnEnterAR').style.display = 'block';
                        document.getElementById('btnMeasure').style.display = 'none';
                        resetMeasure();
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                        if(points.length === 0) {
                            document.getElementById('distLabel').innerText = "Toca para medir";
                        }
                    } else {
                        reticle.visible = false;
                    }
                }

                // Dibujar LÃ­nea dinámica
                if(points.length === 1 && reticle.visible) {
                    const currentP = new THREE.Vector3();
                    currentP.setFromMatrixPosition(reticle.matrix);
                    
                    if(line) scene.remove(line);
                    
                    // LÃ­nea entre punto 1 y retícula
                    const geo = new THREE.BufferGeometry().setFromPoints([points[0], currentP]);
                    const mat = new THREE.LineBasicMaterial({ color: 0x007AFF, linewidth: 3 }); // Apple blue
                    line = new THREE.Line(geo, mat);
                    scene.add(line);
                    
                    const dist = points[0].distanceTo(currentP);
                    document.getElementById('distLabel').innerText = dist.toFixed(2) + " m";
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
