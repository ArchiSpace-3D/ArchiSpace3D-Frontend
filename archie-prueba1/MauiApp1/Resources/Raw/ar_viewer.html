<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Viewer</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: transparent; font-family: sans-serif; }
        canvas { width: 100vw; height: 100vh; display: block; }
        #info { 
            position: absolute; bottom: 20px; left: 20px; color: white; 
            text-shadow: 1px 1px 3px black; font-size: 12px;
            background: rgba(0,0,0,0.5); padding: 8px; border-radius: 8px; pointer-events: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
            background: rgba(255, 255, 255, 0.9); border: 1.5px solid rgba(0,0,0,0.5); 
            border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
        }
        #measureUI {
            position: absolute; bottom: 80px; width: 100%; text-align: center;
        }
        #btnMeasure {
            padding: 15px 35px; font-size: 18px; border-radius: 25px; border: none;
            background: #0A4174; color: white; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); outline: none; cursor: pointer;
        }
        #btnMeasure:active { background: #001D39; }
        #resultTop {
            position: absolute; top: 40px; width: 100%; text-align: center; pointer-events: none;
        }
        #measureResult {
            display: inline-block; padding: 10px 25px; font-size: 26px; border-radius: 12px;
            background: rgba(0,0,0,0.7); color: #7BBDE8; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 2px solid #7BBDE8;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/three.js/build/ar-threex-location-only.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/three.js/build/ar-threex.js"></script>
</head>
<body>
    <div id="crosshair" style="display:none;"></div>
    <div id="resultTop"><div id="measureResult">Buscando Marcador...</div></div>
    
    <div id="info">
        <strong>Para que la regla funcione:</strong> Abre estos dos marcadores o imprímelos y ponlos en la mesa:<br/>
        <a href="https://jeromeetienne.github.io/AR.js/data/images/HIRO.jpg" target="_blank" style="color:#00FF00;">1. Marcador HIRO (Casa)</a><br/>
        <a href="https://upload.wikimedia.org/wikipedia/commons/b/ba/Kanji_marker_ARjs.png" target="_blank" style="color:#0A4174;">2. Marcador KANJI (Punto B)</a>
    </div>

    <script>
        let scene, camera, renderer;
        let arToolkitSource, arToolkitContext, markerRoot;
        let isReady = false;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.Camera();
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setClearColor(new THREE.Color('lightgrey'), 0);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.domElement.style.position = 'absolute';
            renderer.domElement.style.top = '0px';
            renderer.domElement.style.left = '0px';
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(2, 5, 2);
            scene.add(directionalLight);

            arToolkitSource = new THREEx.ArToolkitSource({
                sourceType: 'webcam',
            });

            arToolkitSource.init(function onReady(){
                onResize();
            }, function onError(err) {
                document.getElementById('measureResult').innerText = "Cámara Bloqueada/Error";
                document.getElementById('measureResult').style.color = 'red';
                document.getElementById('info').innerHTML += "<br><span style='color:red'>Error WebRTC: " + err.name + " : " + err.message + "</span>";
            });

            window.addEventListener('resize', function(){
                onResize();
            });

            function onResize(){
                arToolkitSource.onResizeElement();
                arToolkitSource.copyElementSizeTo(renderer.domElement);
                if( arToolkitContext.arController !== null ){
                    arToolkitSource.copyElementSizeTo(arToolkitContext.arController.canvas);
                }
            }

            arToolkitContext = new THREEx.ArToolkitContext({
                cameraParametersUrl: 'https://raw.githack.com/AR-js-org/AR.js/master/data/data/camera_para.dat',
                detectionMode: 'mono'
            });

            arToolkitContext.init(function onCompleted(){
                camera.projectionMatrix.copy( arToolkitContext.getProjectionMatrix() );
            });

            // ================== MARCADOR 1 (HIRO - La Casa) ==================
            markerRoot = new THREE.Group();
            scene.add(markerRoot);
            new THREEx.ArMarkerControls(arToolkitContext, markerRoot, {
                type: 'pattern',
                patternUrl: 'https://raw.githack.com/AR-js-org/AR.js/master/data/data/patt.hiro'
            });

            const houseGroup = new THREE.Group();
            const wallsGeo = new THREE.BoxGeometry(1.5, 1, 1.5);
            const wallsMat = new THREE.MeshStandardMaterial({ color: 0xEEEEEE, roughness: 0.9 });
            const walls = new THREE.Mesh(wallsGeo, wallsMat);
            walls.position.y = 0.5;
            houseGroup.add(walls);

            const roofGeo = new THREE.ConeGeometry(1.3, 0.8, 4);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x8B0000, roughness: 0.7 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = 1.4;
            roof.rotation.y = Math.PI / 4;
            houseGroup.add(roof);

            const doorGeo = new THREE.BoxGeometry(0.4, 0.7, 0.05);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x5C4033 });
            const door = new THREE.Mesh(doorGeo, doorMat);
            door.position.set(0, 0.35, 0.76);
            houseGroup.add(door);

            markerRoot.add(houseGroup);

            // ================== MARCADOR 2 (KANJI - Regla/Medición) ==================
            markerRoot2 = new THREE.Group();
            scene.add(markerRoot2);
            new THREEx.ArMarkerControls(arToolkitContext, markerRoot2, {
                type: 'pattern',
                patternUrl: 'https://raw.githack.com/AR-js-org/AR.js/master/data/data/patt.kanji'
            });

            // Cilindro para marcar el segundo punto
            const pointerGeo = new THREE.CylinderGeometry(0.2, 0.05, 1, 16);
            const pointerMat = new THREE.MeshStandardMaterial({ color: 0x007AFF });
            const pointer = new THREE.Mesh(pointerGeo, pointerMat);
            pointer.position.y = 0.5;
            markerRoot2.add(pointer);

            // ================== LÍNEA DE MEDICIÓN ==================
            const lineMat = new THREE.LineBasicMaterial({ color: 0xFFCC00, linewidth: 5 });
            const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0)]);
            measureLine = new THREE.Line(lineGeo, lineMat);
            scene.add(measureLine);

            isReady = true;
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if( arToolkitSource.ready === false ) return;
            arToolkitContext.update( arToolkitSource.domElement );

            // Lógica de la Regla AR (Si ambos marcadores son visibles)
            if (markerRoot.visible && markerRoot2.visible) {
                // Obtener posiciones absolutas en el mundo 3D
                const pos1 = new THREE.Vector3();
                const pos2 = new THREE.Vector3();
                markerRoot.getWorldPosition(pos1);
                markerRoot2.getWorldPosition(pos2);

                // Dibujar línea entre la Casa (Hiro) y el Puntero (Kanji)
                measureLine.geometry.setFromPoints([pos1, pos2]);
                measureLine.visible = true;

                // Calcular distancia (AR.js asume que el marcador mide 1 unidad de ancho)
                // Si el marcador impreso mide 10cm, 1 unidad = 10cm.
                const distanceInUnits = pos1.distanceTo(pos2);
                
                // Asumiendo un marcador estándar impreso de 10 cm:
                const distanceInCm = (distanceInUnits * 10).toFixed(1);

                document.getElementById('measureResult').innerText = "Distancia: " + distanceInCm + " cm";
                document.getElementById('measureResult').style.color = '#BDD8E9';
            } 
            else if (markerRoot.visible) {
                measureLine.visible = false;
                document.getElementById('measureResult').innerText = "¡Casa Detectada! (Falta Kanji para medir)";
                document.getElementById('measureResult').style.color = '#7BBDE8';
            } 
            else if (markerRoot2.visible) {
                measureLine.visible = false;
                document.getElementById('measureResult').innerText = "¡Punto B Detectado! (Falta Casa para medir)";
                document.getElementById('measureResult').style.color = '#0A4174';
            } 
            else {
                measureLine.visible = false;
                document.getElementById('measureResult').innerText = "Buscando Marcadores...";
                document.getElementById('measureResult').style.color = 'white';
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
